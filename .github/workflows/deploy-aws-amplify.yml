name: CI and Database Setup

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'

jobs:
  setup-infrastructure:
    name: Ensure RDS Database Exists
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-LeadIntelligence-Setup

      - name: Deploy RDS Database (if not exists)
        env:
          STACK_NAME: 'lead-intelligence-db'
          DB_PASSWORD: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "✅ RDS stack already exists"
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region ${{ env.AWS_REGION }} --query 'Stacks[0].StackStatus' --output text)
            echo "Stack status: $STATUS"
          else
            echo "🆕 Creating RDS stack..."
            chmod +x infrastructure/deploy-stack.sh
            ./infrastructure/deploy-stack.sh
          fi

      - name: Get Database URL from CloudFormation
        id: get-db-url
        run: |
          DB_URL_RAW=$(aws cloudformation describe-stacks \
            --stack-name "lead-intelligence-db" \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DatabaseURL`].OutputValue' \
            --output text)
          
          # URL-encode the password to handle special characters
          # Extract: postgresql://user:password@host:port/database
          if [[ "$DB_URL_RAW" =~ postgresql://([^:]+):([^@]+)@(.+) ]]; then
            USERNAME="${BASH_REMATCH[1]}"
            PASSWORD="${BASH_REMATCH[2]}"
            HOST_PORT_DB="${BASH_REMATCH[3]}"
            
            # URL-encode password using Python (available in GitHub Actions)
            PASSWORD_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$PASSWORD', safe=''))")
            DB_URL="postgresql://${USERNAME}:${PASSWORD_ENCODED}@${HOST_PORT_DB}"
            
            echo "✅ Retrieved and URL-encoded DATABASE_URL from CloudFormation"
          else
            DB_URL="$DB_URL_RAW"
            echo "⚠️ Using raw DATABASE_URL (regex did not match)"
          fi
          
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_OUTPUT
          echo ""
          echo "📋 Add this DATABASE_URL to Amplify Console environment variables:"
          echo "$DB_URL"

  ci:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup-infrastructure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Prisma
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Summary
        run: |
          echo "### ✅ CI Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Amplify will auto-deploy on push to connected branches" >> $GITHUB_STEP_SUMMARY
